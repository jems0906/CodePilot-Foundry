services:
  sandbox-image:
    image: codepilot-sandbox:local
    build:
      context: .
      dockerfile: target_codebase/Dockerfile
    command: ["python", "-c", "pass"]
    restart: "no"

  sandbox-runner:
    build:
      context: ./sandbox_runner
      dockerfile: Dockerfile
    environment:
      SANDBOX_IMAGE: codepilot-sandbox:local
      SANDBOX_TIMEOUT_SECONDS: 20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    networks:
      - sandbox_control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codepilot
      POSTGRES_USER: codepilot
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepilot -d codepilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://codepilot:local-dev-only@database:5432/codepilot
      AGENT_PROVIDER: mock
      SANDBOX_MODE: container
      SANDBOX_RUNNER_URL: http://sandbox-runner:9000
      SANDBOX_TIMEOUT_SECONDS: 20
    depends_on:
      database:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - default
      - sandbox_control

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

  evalforge-backend:
    build:
      context: ./evalforge/backend
      dockerfile: Dockerfile
    environment:
      CODEPILOT_API_URL: http://backend:8000
      EVALFORGE_DATABASE_PATH: /app/data/evalforge.sqlite3
    volumes:
      - evalforge_data:/app/data
    depends_on:
      - backend
    ports:
      - "8001:8001"

  evalforge-frontend:
    build:
      context: ./evalforge/frontend
      dockerfile: Dockerfile
    depends_on:
      - evalforge-backend
    ports:
      - "8081:80"

volumes:
  postgres_data:
  evalforge_data:

networks:
  sandbox_control:
    internal: true
